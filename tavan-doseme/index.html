<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavan Döşeme – Trimora Design | Konya</title>
  <meta name="description" content="Tavan Döşeme - Trimora Design Garage, Konya'da profesyonel araç içi döşeme ve kaplama hizmetleri. 0530 235 45 23" />
  <link rel="icon" type="image/png" href="../logo-header.png" />
  <link rel="canonical" href="https://trimoradesign.com/tavan-doseme" />
  <meta property="og:title" content="Tavan Döşeme – Trimora Design" />
  <meta property="og:description" content="Tavan Döşeme Hizmeti" />
  <meta property="og:image" content="https://trimoradesign.com/hero.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .subpage-hero { padding: 100px 20px 60px; text-align: center; }
    .subpage-hero img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; }
    .subpage-hero h1 { font-family: 'Cinzel', serif; font-size: clamp(20px, 5vw, 32px); color: var(--gold); margin-bottom: 8px; }
    .subpage-hero p { color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto; line-height: 1.6; }
    .subpage-gallery { padding: 0 16px 40px; max-width: 900px; margin: 0 auto; }
    .subpage-gallery h2 { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
    .subpage-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; border: 1px dashed var(--border); border-radius: 12px; }
    .subpage-back { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 30px; transition: opacity .2s; }
    .subpage-back:hover { opacity: 0.7; }
    .gallery-upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .gallery-upload-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-logo">
        <a href="../"><img src="../logo-header.png" alt="Trimora Design Garage" /></a>
      </div>
    </div>
    <nav class="main-nav">
      <a href="../">ANASAYFA</a>
      <a href="../#hizmetler">HİZMETLERİMİZ</a>
      <a href="../#galeri">GALERİ</a>
    </nav>
  </header>

  <div class="subpage-hero">
    <img src="../service-tavan.png" alt="Tavan Döşeme" />
    <h1>Tavan Döşeme</h1>
    <p>Tavan Döşeme Hizmeti</p>
  </div>

  <div class="subpage-gallery">
    <h2>GALERİ</h2>
    <div class="gallery-upload-grid" id="galleryGrid">
      <!-- Görseller buraya eklenecek -->
    </div>
    <div class="subpage-empty">
      Görseller yakında eklenecektir.
    </div>
    <a href="../" class="subpage-back">← Ana Sayfaya Dön</a>
  </div>

  <a href="https://wa.me/905302354523?text=Merhaba%2C%20bir%20%C3%BCr%C3%BCn%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener" class="whatsapp-fab" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.97.5 3.82 1.39 5.43L2 22l4.7-1.36A9.953 9.953 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.66 0-3.22-.46-4.56-1.26l-.32-.2-3.33.96.99-3.24-.21-.33A7.953 7.953 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.45-5.9c-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.47-.39-.4-.54-.41l-.46-.01c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.1.16 1.51.1.46-.07 1.43-.58 1.63-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
  </a>

  <script>
  (function() {
    const slug = 'tavan-doseme';
    const brandKey = 'trimora_brand_gallery_' + slug;
    const serviceKey = 'trimora_service_gallery_' + slug;
    const data = localStorage.getItem(brandKey) || localStorage.getItem(serviceKey);
    if (!data) return;
    try {
      const images = JSON.parse(data);
      if (!images.length) return;
      const grid = document.getElementById('galleryGrid');
      const empty = document.querySelector('.subpage-empty');
      if (!grid) return;
      grid.innerHTML = '';
      images.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = document.querySelector('h1')?.textContent || '';
        img.loading = 'lazy';
        grid.appendChild(img);
      });
      if (empty) empty.style.display = 'none';
    } catch(e) {}
  })();
  </script>
</body>
</html>
