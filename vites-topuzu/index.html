<!DOCTYPE html>

  <link rel="stylesheet" href="../style.css" />
  <style>
    .subpage-hero { padding: 100px 20px 60px; text-align: center; }
    .subpage-hero img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; }
    .subpage-hero h1 { font-family: 'Cinzel', serif; font-size: clamp(20px, 5vw, 32px); color: var(--gold); margin-bottom: 8px; }
    .subpage-hero p { color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto; line-height: 1.6; }
    .subpage-gallery { padding: 0 16px 40px; max-width: 900px; margin: 0 auto; }
    .subpage-gallery h2 { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
    .subpage-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; border: 1px dashed var(--border); border-radius: 12px; }
    .subpage-back { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 30px; transition: opacity .2s; }
    .subpage-back:hover { opacity: 0.7; }
    .gallery-upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .gallery-upload-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-logo">
        <a href="../"><img src="../logo-header.png" alt="Trimora Design Garage" /></a>
      </div>
    </div>
    <nav class="main-nav">
      <a href="../">ANASAYFA</a>
      <a href="../#hizmetler">HİZMETLERİMİZ</a>
      <a href="../#galeri">GALERİ</a>
    </nav>
  </header>

  <div class="subpage-hero">
    <img src="../service-vites.png" alt="Vites Topuzu & Körüğü" />
    <h1>Vites Topuzu & Körüğü</h1>
    <p>Vites Topuzu & Körüğü Hizmeti</p>
  </div>

  <div class="subpage-gallery">
    <h2>GALERİ</h2>
    <div class="gallery-upload-grid" id="galleryGrid">
      <!-- Görseller buraya eklenecek -->
    </div>
    <div class="subpage-empty">
      Görseller yakında eklenecektir.
    </div>
    <a href="../" class="subpage-back">← Ana Sayfaya Dön</a>
  </div>

  <a href="https://wa.me/905302354523?text=Merhaba%2C%20bir%20%C3%BCr%C3%BCn%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener" class="whatsapp-fab" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.97.5 3.82 1.39 5.43L2 22l4.7-1.36A9.953 9.953 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.66 0-3.22-.46-4.56-1.26l-.32-.2-3.33.96.99-3.24-.21-.33A7.953 7.953 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.45-5.9c-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.47-.39-.4-.54-.41l-.46-.01c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.1.16 1.51.1.46-.07 1.43-.58 1.63-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
  </a>

  
  <script>
  (function() {
    var slug = 'vites-topuzu';
    fetch('../config.json?v=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(cfg) {
        var items = (cfg.brandGallery && cfg.brandGallery[slug]) ||
                    (cfg.serviceGallery && cfg.serviceGallery[slug]) || [];
        if (!items.length) return;
        var grid = document.getElementById('galleryGrid');
        var empty = document.querySelector('.subpage-empty');
        if (!grid) return;
        grid.innerHTML = '';
        var galleryData = [];
        items.forEach(function(item, i) {
          var src = typeof item === 'string' ? item : item.src;
          var caption = typeof item === 'string' ? '' : (item.caption || '');
          var fullSrc = src.startsWith('gallery/') ? '../' + src : src;
          galleryData.push({ src: fullSrc, caption: caption });
          var card = document.createElement('div');
          card.className = 'gallery-card';
          var capHtml = caption ? '<div class="gallery-card-caption">' + caption + '</div>' : '';
          card.innerHTML = '<img src="' + fullSrc + '" alt="' + ((document.querySelector('h1') || {}).textContent || '') + '" loading="lazy" onclick="openLightbox(' + i + ')" />' + capHtml;
          grid.appendChild(card);
        });
        if (empty) empty.style.display = 'none';
        window.galleryData = galleryData;
      })
      .catch(function() {});

    var currentIdx = 0;

    window.openLightbox = function(idx) {
      currentIdx = idx;
      var lb = document.getElementById('lightbox');
      if (!lb) return;
      lb.classList.add('active');
      updateLightbox();
      document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
      var lb = document.getElementById('lightbox');
      if (lb) lb.classList.remove('active');
      document.body.style.overflow = '';
    };

    window.navLightbox = function(dir) {
      if (!window.galleryData) return;
      currentIdx = (currentIdx + dir + window.galleryData.length) % window.galleryData.length;
      var img = document.getElementById('lbImg');
      if (img) { img.classList.remove('zoomed'); img.style.transform = 'scale(1)'; }
      updateLightbox();
    };

    function updateLightbox() {
      if (!window.galleryData || !window.galleryData[currentIdx]) return;
      var item = window.galleryData[currentIdx];
      var img = document.getElementById('lbImg');
      var cap = document.getElementById('lbCaption');
      var counter = document.getElementById('lbCounter');
      if (img) { img.src = item.src; img.style.transform = 'scale(1)'; img.classList.remove('zoomed'); }
      if (cap) cap.textContent = item.caption || '';
      if (counter) counter.textContent = (currentIdx + 1) + ' / ' + window.galleryData.length;
    }

    window.toggleZoom = function(img) {
      if (img.classList.contains('zoomed')) {
        img.classList.remove('zoomed');
        img.style.transform = 'scale(1)';
      } else {
        img.classList.add('zoomed');
        img.style.transform = 'scale(2)';
      }
    };

    document.addEventListener('keydown', function(e) {
      var lb = document.getElementById('lightbox');
      if (!lb || !lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    });
  })();
  </script>

  <div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lbImg" src="" alt="" onclick="toggleZoom(this)" />
    </div>
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
    <div class="lightbox-caption" id="lbCaption"></div>
    <div class="lightbox-counter" id="lbCounter"></div>
  </div>
</body>
</html>
